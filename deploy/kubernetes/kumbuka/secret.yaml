---
apiVersion: v1
kind: Secret
metadata:
  name: kumbuka-db
stringData:
  database-url: postgres://kumbuka:change-me@postgres:5432/kumbuka?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: kumbuka-oidc
  namespace: kumbuka
type: Opaque
stringData:
  KUMBUKA__OIDC_ISSUER: https://sso.${BASE_DOMAIN}/realms/hq
  KUMBUKA__OIDC_CLIENT_ID:
  KUMBUKA__OIDC_CLIENT_SECRET: # copy from your identity provider
  # Run openssl rand -base64 32 once; paste the full output below.
  # Keep this value across replicas/restarts; use a separate value from the encryption key.
  KUMBUKA__OIDC_SESSION_SECRET:
---
apiVersion: v1
kind: Secret
metadata:
  name: kumbuka-config
  namespace: kumbuka
type: Opaque
stringData:
  # Run openssl rand -base64 32 separately; paste all 44 characters, including the trailing =.
  # Keep the original key across replicas/restarts to preserve access to encrypted settings.
  KUMBUKA__ENCRYPTION_KEY:

