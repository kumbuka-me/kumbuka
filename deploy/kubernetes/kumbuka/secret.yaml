---
apiVersion: v1
kind: Secret
metadata:
  name: kumbuka-db
stringData:
  database-url: postgres://kumbuka:change-me@postgres:5432/kumbuka?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: kumbuka-oidc
  namespace: kumbuka
type: Opaque
stringData:
  KUMBUKA__OIDC_ISSUER: https://sso.${BASE_DOMAIN}/realms/hq
  KUMBUKA__OIDC_CLIENT_ID:
  KUMBUKA__OIDC_CLIENT_SECRET: # copy from your identity provider
  # Run openssl rand -base64 32 once; paste the full output below.
  # Keep this value across replicas/restarts; use a separate value from the encryption key.
  KUMBUKA__OIDC_SESSION_SECRET:
  # KUMBUKA__OIDC_GROUP_CLAIM: groups
  # KUMBUKA__OIDC_ADMIN_GROUP: <ADMIN-GROUP>

---
apiVersion: v1
kind: Secret
metadata:
  name: kumbuka-config
  namespace: kumbuka
type: Opaque
stringData:
  # Run openssl rand -base64 32 separately; paste all 44 characters, including the trailing =.
  # Keep the original key across replicas/restarts to preserve access to encrypted settings.
  KUMBUKA__ENCRYPTION_KEY:

  # Trusted-proxy authentication requires both settings below. Trust only the
  # immediate ingress-controller peers that authenticate users and replace
  # client-supplied identity headers. Do not enter end-user or load-balancer
  # client ranges here.
  # KUMBUKA__AUTH_MODE: proxy
  # KUMBUKA__TRUSTED_PROXY_CIDRS: 10.244.1.20/32,10.244.2.20/32

# vi: ft=yaml
