---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kumbuka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kumbuka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kumbuka
    spec:
      containers:
        - name: kumbuka
          image: ghcr.io/kumbuka-me/kumbuka:latest
          imagePullPolicy: Always
          env:
            - name: KUMBUKA__DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kumbuka-db
                  key: database-url
            - name: KUMBUKA__LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: KUMBUKA__MANAGEMENT_LISTEN_ADDRESS
              value: 0.0.0.0:8081
            - name: KUMBUKA__PUBLIC_URL
              value: https://kumbuka.example.test
            - name: KUMBUKA__PDF_URL
              value: http://html2pdf:8080/render
            - name: KUMBUKA__LOG_FORMAT
              value: json
            - name: KUMBUKA__ACCESS_LOG
              value: "true"
          envFrom:
            - secretRef:
                name: kumbuka-config
            # - secretRef:
            #     name: kumbuka-oidc
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: management
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
