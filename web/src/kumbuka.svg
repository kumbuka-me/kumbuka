<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1280" role="img" aria-labelledby="title desc">
<title id="title">Kumbuka dhow</title>
<desc id="desc">Vector recreation of the supplied dhow logo with a K integrated into the sail.</desc>
<defs>
  <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffaf0"/>
    <stop offset="1" stop-color="#f5ead4"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08798d"/>
    <stop offset="1" stop-color="#07566c"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#71301f"/>
    <stop offset="1" stop-color="#572519"/>
  </linearGradient>
</defs>

<!-- rigging -->
<path d="M438 378L199 883M438 379L252 885" fill="none" stroke="#063e54" stroke-width="17" stroke-linecap="round"/>

<!-- mast -->
<path d="M424 114h39l10 797h-52z" fill="#063e54"/>
<circle cx="443" cy="115" r="24" fill="#063e54"/>

