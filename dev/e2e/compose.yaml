# Disposable authentication E2E services. All credentials and data are test-only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kumbuka_proxy_e2e
      POSTGRES_USER: kumbuka
      POSTGRES_PASSWORD: local-test-password
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumbuka -d kumbuka_proxy_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command:
      ["start-dev", "--import-realm", "--hostname=${E2E_KEYCLOAK_ORIGIN}"]
    environment:
      E2E_OIDC_REDIRECT_URI: ${E2E_OIDC_REDIRECT_URI}
    ports:
      - "127.0.0.1:${E2E_KEYCLOAK_PORT}:8080"
    volumes:
      - ./oidc-realm.json:/opt/keycloak/data/import/kumbuka-realm.json:ro

volumes:
  postgres-data:
