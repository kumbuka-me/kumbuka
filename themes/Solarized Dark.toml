color_scheme = "dark"

[colors]
# Core surfaces
background = "#002b36"
surface = "#073642"
surface_elevated = "#0b4450"
surface_hover = "#0a3f4a"

# Text
text = "#93a1a1"
text_secondary = "#839496"
text_tertiary = "#657b83"
muted = "#586e75"

# Borders
border = "#586e75"
border_strong = "#657b83"
border_subtle = "#073642"

# Accents
accent = "#268bd2"
accent_secondary = "#6c71c4"
