color_scheme = "dark"

[colors]
# Core surfaces
background = "#111318"
surface = "#181b21"
surface_elevated = "#21252d"
surface_hover = "#272c35"

# Text
text = "#e7e9ed"
text_secondary = "#c4c9d1"
text_tertiary = "#949ba7"
muted = "#7e8794"

# Borders
border = "#30353e"
border_strong = "#48505c"
border_subtle = "#252a32"

# Accents
accent = "#8585ff"
accent_secondary = "#a1a1ff"
accent_soft = "#7071cb"

# Status
success = "#65c18c"
warning = "#e9b15b"
error = "#ef7a7a"
danger = "#ff6b6b"

# Selection
selection_text = "#111318"
selection_background = "#8585ff"
