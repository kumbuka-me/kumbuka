color_scheme = "dark"

[colors]
# Core surfaces
background = "#191724"
surface = "#1f1d2e"
surface_elevated = "#26233a"
surface_hover = "#21202e"

# Text
text = "#e0def4"
text_secondary = "#908caa"
text_tertiary = "#6e6a86"
muted = "#6e6a86"

# Borders
border = "#403d52"
border_strong = "#524f67"
border_subtle = "#21202e"

# Accents
accent = "#c4a7e7"
