services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kumbuka
      POSTGRES_USER: kumbuka
      POSTGRES_PASSWORD: kumbuka
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumbuka -d kumbuka"]
      interval: 1s
      timeout: 3s
      retries: 30
