---
name: Unit Tests

on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - "internal/**"
      - "plugins/**"
      - "plugins.lock"
      - ".kumbukaplugins"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "test/**"
      - "Makefile"
      - "Dockerfile*"
      - ".goreleaser.yaml"
      - "web/**"
      - "scripts/**"
      - "themes/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  workflow_dispatch:

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Dependencies
        run: |
          make download

      - name: Generate catalog and build frontend
        run: make check-generated web

      - name: Check generated files and formatting
        run: |
          test -z "$(gofmt -l .)"
          make lint-go
          git diff --check

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

      - name: Run Unit Tests
        run: make test-race
