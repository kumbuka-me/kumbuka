---
name: Tests

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "internal/**"
      - "pkg/**"
      - "plugins/**"
      - "plugins.lock"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "test/**"
      - "Makefile"
      - "Dockerfile*"
      - ".goreleaser.yaml"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: make download
      - name: Build and test frontend
        run: make web test-web
      - name: Upload web distribution
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            web/dist
            build/web-sources.cksum
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Generated files and lint
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: make download
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: .
      - name: Restore frontend build stamp
        run: touch web/dist/.build-stamp
      - name: Check generated files and formatting
        run: make check-generated check-format
      - name: Run linters
        run: make lint vet

  go-tests:
    name: Go tests
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: .
      - name: Restore frontend build stamp
        run: touch web/dist/.build-stamp
      - name: Download plugins
        run: make plugins
      - name: Run Go tests
        run: make test-go

  race-tests:
    name: Race tests
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: .
      - name: Restore frontend build stamp
        run: touch web/dist/.build-stamp
      - name: Download plugins
        run: make plugins
      - name: Run race tests
        run: make test-race

  browser-tests:
    name: Browser tests
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: .
      - name: Restore frontend build stamp
        run: touch web/dist/.build-stamp
      - name: Run browser tests
        run: make test-browser

  required:
    name: Required tests
    if: always()
    needs:
      - frontend
      - quality
      - go-tests
      - race-tests
      - browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              printf 'Required jobs did not pass: %s\n' "$RESULTS"
              exit 1
            fi
          done
