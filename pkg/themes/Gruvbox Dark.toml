color_scheme = "dark"

[colors]
# Core surfaces
background = "#1d2021"
surface = "#282828"
surface_elevated = "#3c3836"
surface_hover = "#504945"

# Text
text = "#ebdbb2"
text_secondary = "#d5c4a1"
text_tertiary = "#bdae93"
muted = "#928374"

# Borders
border = "#504945"
border_strong = "#665c54"
border_subtle = "#3c3836"

# Accents
accent = "#83a598"
accent_secondary = "#d3869b"
accent_soft = "#8ec07c"

# Status
success = "#b8bb26"
warning = "#fabd2f"
error = "#fb4934"
danger = "#cc241d"

# Selection
selection_text = "#1d2021"
selection_background = "#83a598"
